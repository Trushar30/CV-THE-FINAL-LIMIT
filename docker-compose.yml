services:
  mongodb:
    image: mongo:7.0
    container_name: corpverse-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - corpverse-net
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: corpverse-server
    restart: unless-stopped
    ports:
      - '4000:4000'
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/corpverse
      - CORS_ORIGIN=http://localhost:3000,http://localhost:80,http://localhost:4000
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-corpverse_production_jwt_access_secret_min32chars_key!}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-corpverse_production_jwt_refresh_secret_min32chars_key!}
      - COOKIE_SECRET=${COOKIE_SECRET:-corpverse_production_cookie_secret_min32chars_key!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    networks:
      - corpverse-net
    healthcheck:
      test: ['CMD', 'node', '-e', "const http = require('http'); http.get('http://localhost:4000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: corpverse-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - corpverse-net
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  corpverse-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
